    note: Assembly uses the pin-compatible HXY 8205A selected below.
  - ref: U9
    name: ME6211C33M5G
    lcsc: C82942
    role: LDO 3.3V / 500mA
  - ref: U10
    name: USBLC6-2SC6
    lcsc: C7519
    role: USB ESD protection  # also exists in KiCad Power_Protection
  - ref: Q1
    name: SI2301
    lcsc: C10487
