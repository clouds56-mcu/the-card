# ─────────────────────────────────────────────────────────────────────────────
# E-ink panel — represented as connector netlist (no LCSC fetch)
# GDEY029T94, 296x128, SSD1680. Booster parts are host-side.
# ─────────────────────────────────────────────────────────────────────────────
eink_panel:
  model: GDEY029T94
  controller: SSD1680
  interface: 4-wire SPI (BS1 = L)
  source: Good Display datasheet §5 (verified 2026-08)
  pins:                       # J2 connector (FPC 1-24 signal, 25-26 shell)
    1:  NC            # keep open
    2:  EPD_GDR       # host-side booster MOSFET gate drive
    3:  EPD_RESE      # host-side booster current sense
    4:  NC            # keep open
    5:  EPD_VSH2      # +source drive, host-side 1uF/50V bypass
    6:  NC            # keep open
    7:  NC            # keep open
    8:  GND           # BS1 = L  -> 4-wire SPI
    9:  EPD_BUSY      # BUSY     (GPIO11)
    10: EPD_RST       # RES#     (GPIO14)
    11: EPD_DC        # D/C#     (GPIO13)
    12: EPD_CS        # CS#      (GPIO12)
    13: EPD_SCLK      # SCL      (GPIO10)
    14: EPD_SDA       # SDA/MOSI (GPIO9)
    15: EPD_VDDIO     # tie to VCI
    16: EPD_VCI       # +3V3 (switched via Q2)
    17: GND           # VSS
    18: EPD_VDD_CORE  # core 1.8V (internal regulator); 1uF/50V to VSS
    19: NC            # VPP test pin; keep open
    20: EPD_VSH1      # +source drive, host-side 1uF/50V bypass
    21: EPD_VGH       # +gate drive, host-side 1uF/50V bypass
    22: EPD_VSL       # -source drive, host-side 1uF/50V bypass
    23: EPD_VGL       # -gate drive, host-side 1uF/50V bypass
    24: EPD_VCOM      # VCOM, host-side 1uF/50V bypass
  note: |
    Host-side support follows the Good Display GDEY029T94 reference circuit:
    47uH boost inductor, SI1308EDL N-MOSFET, three LMBR0530T1G diodes, 1M gate
    pulldown, 2.2ohm current sense, two 4.7uF/25V pump capacitors, and 1uF/50V bypass
    capacitors on VDD_CORE and each high-voltage output.

# ─────────────────────────────────────────────────────────────────────────────
# Passives — KiCad stock Device:R / Device:C (0402 unless noted)
# ─────────────────────────────────────────────────────────────────────────────
passives:
  decoupling_100nF:            # one per IC VDD/VIN
    count: 8
    value: 100nF
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    refs: [C1, C4, C7, C10-C12, C14-C15]
    note: "U3 LSM6DSO also wants 10µF on VDD — see below"
  bulk_3v3:
    count: 1
    value: 10µF
    footprint: "Capacitor_SMD:C_0603_1608Metric"
    net: "+3V3"
  bulk_vbat:
    count: 1
    value: 10µF
    footprint: "Capacitor_SMD:C_0603_1608Metric"
    net: "VBAT"
  tp4056_vcc_cap:
    ref: C5
    value: 10µF                # TP4056 VCC per datasheet
    footprint: "Capacitor_SMD:C_0603_1608Metric"
  tp4056_bat_cap:
    ref: C6
    value: 10µF                # TP4056 BAT per datasheet
    footprint: "Capacitor_SMD:C_0603_1608Metric"
  tp4056_prog:
    ref: R7
    value: 2.2kΩ               # about 500mA, from RPROG=1100V/IBAT
    footprint: "Resistor_SMD:R_0402_1005Metric"
  dw01_filter:
    vdd_resistor: { ref: R9, value: 100Ω, footprint: "Resistor_SMD:R_0402_1005Metric" }
    vm_resistor:  { ref: R10, value: 1kΩ, footprint: "Resistor_SMD:R_0402_1005Metric" }
    capacitor:    { ref: C7, value: 100nF, footprint: "Capacitor_SMD:C_0402_1005Metric" }
    note: "Values and DOUT→G1 / COUT→G2 topology verified against the selected DW01A and HXY 8205A datasheets."
  imu_vdd_bulk:
    ref: C13
    value: 10µF                # LSM6DSO VDD bulk
    footprint: "Capacitor_SMD:C_0603_1608Metric"
  fg_cap:
    ref: C10
    value: 100nF               # MAX17048 VDD decoupling
    footprint: "Capacitor_SMD:C_0402_1005Metric"
  ldo_in_cap:
    ref: C8
    value: 1µF                 # ME6211 VIN
    footprint: "Capacitor_SMD:C_0603_1608Metric"
  ldo_out_cap:
    ref: C9
    value: 1µF                 # ME6211 VOUT
    footprint: "Capacitor_SMD:C_0603_1608Metric"
  led_cap:
    ref: C15
    value: 100nF               # WS2812 VDD
    footprint: "Capacitor_SMD:C_0402_1005Metric"
  cc_pulldowns:                # USB-C UFP (we are sink/device): 5.1k on each CC
    count: 2
    value: 5.1kΩ
    footprint: "Resistor_SMD:R_0402_1005Metric"
    nets: [CC1, CC2]
  button_debounce_caps:        # 100nF across each button to GND
    count: 4
    value: 100nF
    footprint: "Capacitor_SMD:C_0402_1005Metric"
  vbatt_divider:               # backup ADC sample; MAX17048 is primary
    enabled: optional
    r_high: { value: 1MΩ, footprint: "Resistor_SMD:R_0402_1005Metric" }
    r_low:  { value: 300kΩ, footprint: "Resistor_SMD:R_0402_1005Metric" }

# ─────────────────────────────────────────────────────────────────────────────
# Power rails
# ─────────────────────────────────────────────────────────────────────────────
rails:
  VBUS:   "+5V from USB-C"
  "+BAT": "Battery cell positive, 3.0–4.2V"
  BAT_NEG: "Battery cell negative before the protection FETs; not system ground"
  "+3V3": "System rail from ME6211 LDO (always on)"
  AUX_3V3: "Switchable branch rail via Q1 (P-MOSFET, PWR_AUX=GPIO47) — status LED only"
  EPD_VCI: "Switchable e-paper VCI/VDDIO and booster input via Q2"

