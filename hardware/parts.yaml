# the-card — Schematic Parts Manifest
# Source-of-truth for schematic generation.
#   - actives/ICs/connectors with an `lcsc` id are fetched via `easyeda2kicad`
#     into hardware/libraries/ (symbol + footprint + 3D).
#   - common passives reuse fetched project templates; the booster and bring-up
#     parts use KiCad stock symbols and footprints.
#   - The bare e-ink panel is represented by a 24-pin FPC connector; its required
#     SSD1680 booster and high-voltage capacitors are populated on our PCB.
# Refdes follow the schematic. Update here = update the schematic.

project: the-card
eda: kicad
kicad_version: "10.0"
libs_output: hardware/libraries/

# ─────────────────────────────────────────────────────────────────────────────
# Active parts / ICs / connectors  (fetch from LCSC via easyeda2kicad)
# ─────────────────────────────────────────────────────────────────────────────
lcsc_parts:
  - ref: U1
    name: ESP32-S3-WROOM-1-N16R8
    lcsc: C2913202
    role: MCU (WiFi+BLE, 16MB Flash, 8MB Octal PSRAM)
  - ref: U2
    name: ST25DV04KC-IE8S3
    lcsc: C5221752
    role: NFC dynamic tag with GPO wake (V_EH left unconnected)
  - ref: U3
    name: LSM6DSOTR
    lcsc: C2655100
    role: 6-axis IMU
  - ref: U4
    name: SHT40-BD1B-R2
    lcsc: C7461849
    role: Temp / Humidity
  - ref: U5
    name: MAX17048G+T10
    lcsc: C2682616
    role: Li-ion fuel gauge (ModelGauge)
  - ref: U6
    name: TP4056
    lcsc: C382139
    role: Li-ion charger (configured for approximately 500mA)
  - ref: U7
    name: DW01A
    lcsc: C18164398
    role: Battery protection IC
  - ref: U8
    name: FS8205A
    lcsc: C16052
    role: Dual N-MOSFET (protection)
  - ref: U9
    name: ME6211C33M5G
    lcsc: C82942
    role: LDO 3.3V / 500mA
  - ref: U10
    name: USBLC6-2SC6
    lcsc: C7519
    role: USB ESD protection  # also exists in KiCad Power_Protection
  - ref: Q1
    name: SI2301
    lcsc: C10487
    role: P-MOSFET — AUX LED rail and e-paper VCI gates  # also in Transistor_FET
    qty: 2                     # Q1, Q2
  - ref: D1
    name: WS2812B-Mini
    lcsc: C527089
    role: RGB status LED (on AUX branch rail)
  - ref: J1
    name: TYPE-C-31-M-12
    lcsc: C165948
    role: USB-C receptacle (6-pin, power+data)
  - ref: SW
    name: TS-1187A
    lcsc: C318884
    role: Tactile button (watch-style)
    qty: 4                     # SW1 UP, SW2 DOWN, SW3 SEL, SW4 MENU
  - ref: J2
    name: Hirose FH12-24S-0.5SH(55)
    lcsc: distributor
    role: E-ink panel FPC connector (24 signal + 2 mount pads)
    note: bottom-contact ZIF, 0.5 mm pitch, for 0.30 mm FPC

# ─────────────────────────────────────────────────────────────────────────────
# Passive templates — fetched into libraries/passives.kicad_sym (symbol only;
# footprints are assigned in circuit.py). One symbol reused across many values.
# ─────────────────────────────────────────────────────────────────────────────
passive_templates:
  - lcsc: C25744
    symbol: 0402WGF1002TCE
    role: 0402 resistor (reused for all R)
  - lcsc: C1525
    symbol: CL05B104KO5NNNC
    role: 0402 capacitor (reused for all 0402 C)
  - lcsc: C19702
    symbol: CL10A106KP8NNNC
    role: 0603 capacitor (reused for all 0603 C)

# Stock KiCad symbols and footprints; verify availability before fabrication.
standard_parts:
  - ref: J3
    name: JST-PH 2-pin horizontal
    role: 1S battery connector (pin 1 +BAT, pin 2 BAT_NEG)
    footprint: "Connector_JST:JST_PH_S2B-PH-K_1x02_P2.00mm_Horizontal"
    note: Battery cable polarity is not standardized; inspect the actual pack.
  - ref: L1
    name: SRU5016-470Y
    role: E-paper boost inductor, 47uH
    footprint: "Inductor_SMD:L_Bourns_SRU5016_5.2x5.2mm"
  - ref: Q3
    name: Si1304BDL
    role: E-paper booster 30V N-MOSFET
    footprint: "Package_TO_SOT_SMD:SOT-323_SC-70"
  - ref: D2-D4
    name: MBR0530
    role: E-paper booster Schottky diodes, 30V 500mA
    footprint: "Diode_SMD:D_SOD-123"
  - ref: TP1-TP6
    name: TestPoint
    role: Battery, 3.3V, ground, reset, and boot bring-up access
    footprint: "TestPoint:TestPoint_Pad_D1.0mm"

# ─────────────────────────────────────────────────────────────────────────────
# E-ink panel — represented as connector netlist (no LCSC fetch)
# GDEY029T94, 296x128, SSD1680. Booster parts are host-side.
# ─────────────────────────────────────────────────────────────────────────────
eink_panel:
  model: GDEY029T94
  controller: SSD1680
  interface: 4-wire SPI (BS1 = L)
  source: Good Display datasheet §5 (verified 2026-08)
  pins:                       # J2 connector (FPC 1-24 signal, 25-26 shell)
    1:  NC            # keep open
    2:  EPD_GDR       # host-side booster MOSFET gate drive
    3:  EPD_RESE      # host-side booster current sense
    4:  NC            # keep open
    5:  EPD_VSH2      # +source drive, host-side 1uF/25V bypass
    6:  NC            # keep open
    7:  NC            # keep open
    8:  GND           # BS1 = L  -> 4-wire SPI
    9:  EPD_BUSY      # BUSY     (GPIO11)
    10: EPD_RST       # RES#     (GPIO14)
    11: EPD_DC        # D/C#     (GPIO13)
    12: EPD_CS        # CS#      (GPIO12)
    13: EPD_SCLK      # SCL      (GPIO10)
    14: EPD_SDA       # SDA/MOSI (GPIO9)
    15: EPD_VDDIO     # tie to VCI
    16: EPD_VCI       # +3V3 (switched via Q2)
    17: GND           # VSS
    18: EPD_VDD_CORE  # core 1.8V (internal regulator); 1uF/25V to VSS
    19: NC            # VPP test pin; keep open
    20: EPD_VSH1      # +source drive, host-side 1uF/25V bypass
    21: EPD_VGH       # +gate drive, host-side 1uF/25V bypass
    22: EPD_VSL       # -source drive, host-side 1uF/25V bypass
    23: EPD_VGL       # -gate drive, host-side 1uF/25V bypass
    24: EPD_VCOM      # VCOM, host-side 1uF/25V bypass
  note: |
    Host-side support follows the Good Display GDEY029T94 reference circuit:
    47uH boost inductor, 30V N-MOSF, three MBR0530 diodes, 1M gate pulldown,
    2.2ohm current sense, two 4.7uF/25V pump capacitors, and 1uF/25V bypass
    capacitors on VDD_CORE and each high-voltage output.

# ─────────────────────────────────────────────────────────────────────────────
# Passives — KiCad stock Device:R / Device:C (0402 unless noted)
# ─────────────────────────────────────────────────────────────────────────────
passives:
  decoupling_100nF:            # one per IC VDD/VIN
    count: 9
    value: 100nF
    footprint: "Capacitor_SMD:C_0402_1005Metric"
    on: [U1(3x VDD/3V3), U2, U3(VDD+VDDIO→use 2), U4, U5, U6(VCC), U9(VIN)]
    note: "U3 LSM6DSO also wants 10µF on VDD — see below"
  bulk_3v3:
    count: 1
    value: 10µF
    footprint: "Capacitor_SMD:C_0603_1608Metric"
    net: "+3V3"
  bulk_vbat:
    count: 1
    value: 10µF
    footprint: "Capacitor_SMD:C_0603_1608Metric"
    net: "VBAT"
  tp4056_vcc_cap:
    ref: C5
    value: 10µF                # TP4056 VCC per datasheet
    footprint: "Capacitor_SMD:C_0603_1608Metric"
  tp4056_bat_cap:
    ref: C6
    value: 10µF                # TP4056 BAT per datasheet
    footprint: "Capacitor_SMD:C_0603_1608Metric"
  tp4056_prog:
    ref: R7
    value: 2.2kΩ               # about 500mA, from RPROG=1100V/IBAT
    footprint: "Resistor_SMD:R_0402_1005Metric"
  dw01_filter:
    vdd_resistor: { ref: R9, value: 100Ω, footprint: "Resistor_SMD:R_0402_1005Metric" }
    vm_resistor:  { ref: R10, value: 1kΩ, footprint: "Resistor_SMD:R_0402_1005Metric" }
    capacitor:    { ref: C7, value: 100nF, footprint: "Capacitor_SMD:C_0402_1005Metric" }
    note: "Values and DOUT→G1 / COUT→G2 topology verified against the selected DW01A and FS8205A datasheets."
  imu_vdd_bulk:
    ref: C13
    value: 10µF                # LSM6DSO VDD bulk
    footprint: "Capacitor_SMD:C_0603_1608Metric"
  fg_cap:
    ref: C10
    value: 1µF                 # MAX17048 VDD decoupling
    footprint: "Capacitor_SMD:C_0402_1005Metric"
  ldo_in_cap:
    ref: C8
    value: 1µF                 # ME6211 VIN
    footprint: "Capacitor_SMD:C_0402_1005Metric"
  ldo_out_cap:
    ref: C9
    value: 1µF                 # ME6211 VOUT
    footprint: "Capacitor_SMD:C_0402_1005Metric"
  led_cap:
    ref: C15
    value: 100nF               # WS2812 VDD
    footprint: "Capacitor_SMD:C_0402_1005Metric"
  cc_pulldowns:                # USB-C UFP (we are sink/device): 5.1k on each CC
    count: 2
    value: 5.1kΩ
    footprint: "Resistor_SMD:R_0402_1005Metric"
    nets: [CC1, CC2]
  button_debounce_caps:        # 100nF across each button to GND
    count: 4
    value: 100nF
    footprint: "Capacitor_SMD:C_0402_1005Metric"
  vbatt_divider:               # backup ADC sample; MAX17048 is primary
    enabled: optional
    r_high: { value: 1MΩ, footprint: "Resistor_SMD:R_0402_1005Metric" }
    r_low:  { value: 300kΩ, footprint: "Resistor_SMD:R_0402_1005Metric" }

# ─────────────────────────────────────────────────────────────────────────────
# Power rails
# ─────────────────────────────────────────────────────────────────────────────
rails:
  VBUS:   "+5V from USB-C"
  "+BAT": "Battery cell positive, 3.0–4.2V"
  BAT_NEG: "Battery cell negative before the protection FETs; not system ground"
  "+3V3": "System rail from ME6211 LDO (always on)"
  AUX_3V3: "Switchable branch rail via Q1 (P-MOSFET, PWR_AUX=GPIO47) — status LED only"
  EPD_VCI: "Switchable e-paper VCI/VDDIO and booster input via Q2"

