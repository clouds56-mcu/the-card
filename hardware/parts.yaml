    qty: 2                     # Q1, Q2
  - ref: D1
    name: WS2812B-Mini
    lcsc: C527089
    role: RGB status LED (on AUX branch rail)
  - ref: J1
    name: TYPE-C-31-M-12
    lcsc: C165948
    role: USB-C receptacle (6-pin, power+data)
  - ref: SW
    name: TS-1187A
    lcsc: C318884
    role: Tactile button (watch-style)
    qty: 4                     # SW1 UP, SW2 DOWN, SW3 SEL, SW4 MENU
  - ref: J2
    name: Hirose FH12-24S-0.5SH(55)
    lcsc: distributor
    role: E-ink panel FPC connector (24 signal + 2 mount pads)
    note: bottom-contact ZIF, 0.5 mm pitch, for 0.30 mm FPC
  - ref: J3
    name: S2B-PH-SM4-TB(LF)(SN)
    lcsc: C295747
    role: 1S battery connector (pin 1 +BAT, pin 2 BAT_NEG)
    footprint: "Connector_JST:JST_PH_S2B-PH-SM4-TB_1x02-1MP_P2.00mm_Horizontal"
    note: Right-angle SMT JST-PH. Battery cable polarity is not standardized; inspect the actual pack.
  - ref: L1
    name: XRNR5020-47uH/M
    lcsc: C5339697
    role: E-paper boost inductor, 47uH, 750mA rated / 770mA saturation
    footprint: "the-card:IND-SMD_L5.0-W5.0_XRNR5020"

# ─────────────────────────────────────────────────────────────────────────────
# Passive templates — fetched into libraries/passives.kicad_sym (symbol only;
