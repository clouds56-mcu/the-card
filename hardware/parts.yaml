    name: ESP32-S3-WROOM-1-N16R8
    lcsc: C2913202
    role: MCU (WiFi+BLE, 16MB Flash, 8MB Octal PSRAM)
  - ref: U2
    name: ST25DV04KC-IE8S3
    lcsc: C5221752
    role: NFC dynamic tag with GPO wake (V_EH left unconnected)
  - ref: U3
    name: LSM6DSOTR
    lcsc: C2655100
    role: 6-axis IMU
  - ref: U4
    name: SHT40-BD1B-R2
    lcsc: C7461849
    role: Temp / Humidity
  - ref: U5
    name: MAX17048G+T10
    lcsc: C2682616
    role: Li-ion fuel gauge (ModelGauge)
  - ref: U6
    name: TP4056
    lcsc: C382139
