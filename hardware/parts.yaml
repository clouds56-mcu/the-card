# the-card — Schematic Parts Manifest
# Source-of-truth for schematic generation.
#   - supplier-specific parts with an `lcsc` id are fetched via `easyeda2kicad`
#     into hardware/libraries/ (symbol + footprint + 3D).
#   - `assembly_parts` assigns exact purchasable parts to stock/project symbols
#     without fetching additional EasyEDA libraries.
#   - common passives reuse fetched project templates; bring-up test points use
#     KiCad stock symbols and footprints.
#   - The bare e-ink panel is represented by a 24-pin FPC connector; its required
#     SSD1680 booster and high-voltage capacitors are populated on our PCB.
# Refdes follow the schematic. Update here = update the schematic.

project: the-card
eda: kicad
kicad_version: "10.0"
libs_output: hardware/libraries/

# ─────────────────────────────────────────────────────────────────────────────
# Supplier-specific parts  (fetch from LCSC via easyeda2kicad)
# ─────────────────────────────────────────────────────────────────────────────
lcsc_parts:
