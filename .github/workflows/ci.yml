name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hardware:
    name: Hardware checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: kicad/kicad:10.0.5@sha256:182c8005cb775a2c448a4c18681d489f1ff472a761885eba3e08b07e3c0564de
      options: --user 0
    env:
      KICAD_CONFIG_HOME: /home/kicad/.config/kicad
    defaults:
      run:
        shell: bash
        working-directory: hardware

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          python3 --version
          kicad-cli --version

      - name: Compile Python tooling
        run: python3 -m compileall -q .

      - name: Run unit tests
        run: python3 -m unittest discover -v -s . -p "test_*.py"

      - name: Run schematic ERC
        run: |
          mkdir -p ci-reports
          kicad-cli sch erc \
            --format json \
            --output ci-reports/erc.json \
            --severity-all \
            --exit-code-violations \
            the-card.kicad_sch

      - name: Verify NFC design invariants
        run: python3 verify_nfc_design.py

      - name: Run PCB DRC and schematic parity
        run: |
          kicad-cli pcb drc \
            --format json \
            --output ci-reports/drc.json \
            --severity-all \
            --schematic-parity \
            --exit-code-violations \
            the-card.kicad_pcb

      - name: Export design-review artifacts
        run: python3 scripts/export_design_review.py

      - name: Upload design-review artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: design-review-${{ github.sha }}
          path: hardware/ci-design-review
          if-no-files-found: error
          retention-days: 7

      - name: Upload KiCad reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kicad-reports
          path: hardware/ci-reports/*.json
          if-no-files-found: warn
          retention-days: 7

  website:
    name: Website checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Audit website dependencies
        run: npm audit --audit-level=high

      - name: Lint website
        run: npm run lint

      - name: Type-check website
        run: npm run typecheck

      - name: Build and test website
        run: npm test

  pages-build:
    name: Build GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs:
      - hardware
      - website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: website

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install website dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build static GitHub Pages site
        run: npm run build:pages
        env:
          NEXT_PUBLIC_SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ASSET_PREFIX: ${{ steps.pages.outputs.base_url }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}

      - name: Test static GitHub Pages site
        run: npm run test:pages
        env:
          NEXT_PUBLIC_SITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          SITE_ASSET_PREFIX: ${{ steps.pages.outputs.base_url }}
          SITE_ORIGIN: ${{ steps.pages.outputs.origin }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist/client

  pages-deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
