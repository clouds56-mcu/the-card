name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware:
    name: Hardware checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: kicad/kicad:10.0.5-full@sha256:32495bae547afb6a0cfd3decc686a8c5acc0ef616d5c56c1b4861a770bfe9464
      options: --user 0
    defaults:
      run:
        shell: bash
        working-directory: hardware

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show tool versions
        run: |
          python3 --version
          kicad-cli --version

      - name: Compile Python tooling
        run: python3 -m compileall -q .

      - name: Run unit tests
        run: python3 -m unittest discover -v -s . -p "test_*.py"

      - name: Run schematic ERC
        run: |
          mkdir -p ci-reports
          kicad-cli sch erc \
            --format json \
            --output ci-reports/erc.json \
            --severity-all \
            --exit-code-violations \
            the-card.kicad_sch

      - name: Run PCB DRC and schematic parity
        run: |
          kicad-cli pcb drc \
            --format json \
            --output ci-reports/drc.json \
            --severity-all \
            --schematic-parity \
            --exit-code-violations \
            the-card.kicad_pcb

      - name: Upload KiCad reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kicad-reports
          path: hardware/ci-reports/*.json
          if-no-files-found: warn
          retention-days: 7
